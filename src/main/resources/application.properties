# ---------------------------------------------------------------------------
# Conexão com o MongoDB
# Padrão: MongoDB instalado na própria máquina (localhost:27017).
# Para usar outro servidor, defina a variável de ambiente MONGODB_URI.
# ---------------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:pediupatrao}

# (Alternativa antiga, cluster Atlas compartilhado da turma - use um nome de banco SEU para não misturar dados:)
# spring.data.mongodb.uri=mongodb+srv://alunos:semestudareureprovarei@cluster0.tibnnz0.mongodb.net/?appName=Cluster0
# spring.data.mongodb.database=pizzaria_SEUNOME

# ---------------------------------------------------------------------------
# Regras da aplicação
# ---------------------------------------------------------------------------
# Fuso usado para data/hora de pedidos e auditoria
pediupatrao.timezone=America/Sao_Paulo
# Cria usuários de demonstração (gerente01 / atendente01) e produtos de exemplo se não existirem.
# Em produção, defina como false.
pediupatrao.seed-demo=true

# O login é feito pelos usuários do MongoDB (UsuarioDetailsService); não há usuário padrão do Spring.

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.umc.pediupatrao=INFO