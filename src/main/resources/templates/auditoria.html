<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-journal-text me-2 text-primary"></i>Auditoria
        </h2>
        <span class="text-muted small">Somente leitura · <span th:text="${total}">0</span> registro(s)</span>
    </div>

    <!-- Filtros -->
    <form th:action="@{/auditoria}" method="get" class="row g-2 mb-3">
        <div class="col-md-3">
            <select name="entidade" class="form-select form-select-sm">
                <option value="">Todas as entidades</option>
                <option value="PEDIDO" th:selected="${fEntidade == 'PEDIDO'}">Pedido</option>
                <option value="CLIENTE" th:selected="${fEntidade == 'CLIENTE'}">Cliente</option>
                <option value="USUARIO" th:selected="${fEntidade == 'USUARIO'}">Usuário</option>
            </select>
        </div>
        <div class="col-md-3">
            <input type="text" name="entidadeId" class="form-control form-control-sm" placeholder="ID da entidade"
                   th:value="${fEntidadeId}"/>
        </div>
        <div class="col-md-3">
            <input type="text" name="usuario" class="form-control form-control-sm" placeholder="Usuário"
                   th:value="${fUsuario}"/>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-search"></i> Filtrar</button>
            <a th:href="@{/auditoria}" class="btn btn-sm btn-outline-secondary">Limpar</a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Data/hora</th>
                        <th>Usuário</th>
                        <th>Operação</th>
                        <th>Entidade</th>
                        <th>Alterações (anterior → novo)</th>
                        <th>Justificativa</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(registros)}">
                        <td colspan="6" class="text-center text-muted py-5">Nenhum registro de auditoria.</td>
                    </tr>
                    <tr th:each="r : ${registros}">
                        <td class="ps-4 small text-nowrap"
                            th:text="${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
                        <td class="small">
                            <strong th:text="${r.usuario}"></strong><br/>
                            <span class="badge bg-secondary" th:text="${r.perfil}"></span>
                        </td>
                        <td class="small" th:text="${r.operacao.descricao}"></td>
                        <td class="small">
                            <span th:text="${r.entidade}"></span><br/>
                            <code class="text-muted" th:text="${r.entidadeId}"></code>
                        </td>
                        <td class="small">
                            <div th:each="a : ${r.alteracoes}">
                                <strong th:text="${a.campo}"></strong>:
                                <span class="text-danger" th:text="${a.valorAnterior != null} ? ${a.valorAnterior} : '∅'"></span>
                                →
                                <span class="text-success" th:text="${a.valorNovo != null} ? ${a.valorNovo} : '∅'"></span>
                            </div>
                        </td>
                        <td class="small" th:text="${r.justificativa}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-between small" th:if="${totalPaginas > 1}">
            <a th:if="${pagina > 0}"
               th:href="@{/auditoria(pagina=${pagina - 1}, entidade=${fEntidade}, entidadeId=${fEntidadeId}, usuario=${fUsuario})}">&laquo; Mais recentes</a>
            <span th:text="'Página ' + ${pagina + 1} + ' de ' + ${totalPaginas}"></span>
            <a th:if="${pagina + 1 < totalPaginas}"
               th:href="@{/auditoria(pagina=${pagina + 1}, entidade=${fEntidade}, entidadeId=${fEntidadeId}, usuario=${fUsuario})}">Mais antigos &raquo;</a>
        </div>
    </div>
</div>

</body>
</html>
