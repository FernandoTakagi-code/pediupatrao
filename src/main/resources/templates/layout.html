<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pediu Patrão - Sistema de Pedidos</title>
    <!-- Token CSRF para requisições fetch (POST/PUT/DELETE) feitas por JavaScript -->
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''"/>
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : 'X-CSRF-TOKEN'"/>
    <script>
        (function () {
            const nativeFetch = window.fetch;
            window.fetch = function (input, init) {
                init = init || {};
                const method = (init.method || 'GET').toUpperCase();
                if (method !== 'GET' && method !== 'HEAD') {
                    const token = document.querySelector('meta[name="_csrf"]');
                    const header = document.querySelector('meta[name="_csrf_header"]');
                    if (token && header && token.content) {
                        init.headers = Object.assign({}, init.headers, {[header.content]: token.content});
                    }
                }
                return nativeFetch.call(this, input, init);
            };
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- Botão para abrir/fechar a sidebar em telas pequenas -->
<div class="toggle-btn btn btn-dark d-md-none">
    <span>&#9776;</span>
</div>

<!-- Sidebar incluído como fragmento -->
<aside>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
</aside>

<!-- Conteúdo Principal -->
<main class="container-fluid mt-4">
    <div th:replace="~{__${content}__}"></div>
</main>

<script th:src="@{/js/script.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
